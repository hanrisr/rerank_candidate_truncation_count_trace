[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hanrisr-rerank_candidate_truncation_count_trace"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出AIGC 内容生成工程师·重排模型的候选截断上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hanrisr" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://hanrisr.github.io"
Repository = "https://github.com/hanrisr/rerank_candidate_truncation_count_trace"
Issues = "https://github.com/hanrisr/rerank_candidate_truncation_count_trace/issues"

[project.scripts]
rerank_candidate_truncation_count_trace = "rerank_candidate_truncation_count_trace:main"

[tool.setuptools]
py-modules = ["rerank_candidate_truncation_count_trace"]
